<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <!-- Faz o site se adaptar bem a celulares -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boletim Digital</title>
  <!-- Liga o arquivo de estilos -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== TELA DE ACESSO (PIN) ===== -->
  <section id="tela-acesso" class="tela-acesso">
    <div class="acesso-card">
      <h1>Boletim Digital</h1>
      <p class="subtitulo">8º Ano — Turma 8C — Nº 35</p>

      <div class="campo-pin">
        <label for="input-pin">Digite seu PIN</label>
        <input
          type="password"
          id="input-pin"
          inputmode="numeric"
          autocomplete="off"
          placeholder="PIN"
          maxlength="8"
        />
      </div>

      <button id="btn-entrar" class="btn-principal" type="button">Entrar</button>

      <p id="msg-acesso" class="msg-acesso" role="status"></p>
    </div>
  </section>

  <!-- ===== CONTEÚDO DO BOLETIM (aparece após o login) ===== -->
  <div id="conteudo-boletim" class="oculto">

    <!-- Cabeçalho com título e subtítulo -->
    <header class="cabecalho">
      <h1>Boletim Digital</h1>
      <p class="subtitulo">8º Ano — Turma 8C — Nº 35</p>
    </header>

    <main class="conteudo">

      <!-- Área dos cards de resumo (preenchida pelo JavaScript) -->
      <section class="cards" id="cards"></section>

      <!-- Área da tabela de disciplinas -->
      <section class="tabela-area">
        <div class="tabela-topo">
          <h2>Notas por disciplina</h2>
          <button id="btn-alterar" class="btn-secundario" type="button">Alterar dados</button>
        </div>

        <!-- Tabela responsiva: em telas pequenas ela rola na horizontal -->
        <div class="tabela-scroll">
          <table class="boletim">
            <thead>
              <tr>
                <th>Disciplina</th>
                <th>1º Tri</th>
                <th>2º Tri</th>
                <th>3º Tri</th>
                <th>Média</th>
                <th>Faltas</th>
                <th>Situação</th>
              </tr>
            </thead>
            <!-- O corpo da tabela é preenchido pelo script.js -->
            <tbody id="corpo-tabela"></tbody>
          </table>
        </div>

        <!-- Mensagem de status do salvamento -->
        <p id="msg-salvar" class="msg-salvar" role="status"></p>
      </section>

    </main>
  </div>

  <!-- Liga o arquivo JavaScript no final para a página carregar mais rápido -->
  <script src="script.js"></script>
</body>
</html>
